name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.15"

jobs:
  # ------------------------------------------------------------------ Windows e Linux
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            target: windows-x64
          - os: ubuntu-latest
            label: Linux x64
            target: linux-x64

    env:
      # Os testes não abrem janelas; os que precisam de GPU (OpenGL 3.3) se pulam sozinhos.
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Instalar ffmpeg e bibliotecas do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libegl1 libgl1 libopengl0 libglx-mesa0 libgl1-mesa-dri \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xfixes0 libfontconfig1 libdbus-1-3

      - name: Instalar o ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Conferir o ffmpeg
        shell: bash
        run: |
          ffmpeg -hide_banner -version | head -n 1
          ffprobe -hide_banner -version | head -n 1

      - name: Instalar dependências Python
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8" "pyinstaller>=6.10"
          python --version

      - name: Testes
        shell: bash
        run: |
          set +e
          python -m pytest -q
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "Nenhum teste encontrado (código 5 do pytest); seguindo com o build."
            exit 0
          fi
          exit $code

      - name: Gerar o executável (PyInstaller)
        shell: bash
        run: python -m PyInstaller --noconfirm --clean PeliculaConverter.spec

      - name: Compactar
        id: pack
        shell: bash
        run: |
          ver=$(python -c "import pelicula; print(pelicula.__version__)")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then label="$GITHUB_REF_NAME"; else label="$ver-${GITHUB_SHA::7}"; fi
          base="PeliculaConverter-$label-${{ matrix.target }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            file="$base.zip"
            pwsh -NoProfile -Command "Compress-Archive -Path dist/PeliculaConverter -DestinationPath '$file'"
          else
            file="$base.tar.gz"
            tar -czf "$file" -C dist PeliculaConverter
          fi
          ls -l "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Enviar artefato
        uses: actions/upload-artifact@v4
        with:
          name: PeliculaConverter-${{ matrix.target }}
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error

  # ------------------------------------------------------------------ macOS
  macos:
    name: macOS (desativado)
    # O suporte a macOS está preparado (spec com BUNDLE, deps.py), mas DESATIVADO por enquanto:
    # o app ainda não foi testado no macOS (contexto OpenGL 3.3 Core via CGL, assinatura e
    # notarização do .app, download automático do ffmpeg). Para ativar, apague a linha `if: false`
    # e acrescente `macos` na lista `needs` do job `release`.
    if: false
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true
      - name: Instalar o ffmpeg
        run: brew install ffmpeg
      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8" "pyinstaller>=6.10"
      - name: Testes
        run: |
          set +e
          python -m pytest -q
          code=$?
          if [ "$code" -eq 5 ]; then exit 0; fi
          exit $code
      - name: Gerar o .app (PyInstaller)
        run: python -m PyInstaller --noconfirm --clean PeliculaConverter.spec
      - name: Compactar
        id: pack
        run: |
          ver=$(python -c "import pelicula; print(pelicula.__version__)")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then label="$GITHUB_REF_NAME"; else label="$ver-${GITHUB_SHA::7}"; fi
          file="PeliculaConverter-$label-macos.tar.gz"
          tar -czf "$file" -C dist PeliculaConverter.app
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: PeliculaConverter-macos
          path: ${{ steps.pack.outputs.file }}

  # ------------------------------------------------------------------ release (tags v*)
  release:
    name: Publicar release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Baixar os pacotes gerados
        uses: actions/download-artifact@v4
        with:
          pattern: PeliculaConverter-*
          path: pacotes
          merge-multiple: true

      - name: Listar os pacotes
        run: ls -l pacotes

      - name: Criar a release com o .zip (Windows) e o .tar.gz (Linux)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pacotes/*.zip
            pacotes/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
