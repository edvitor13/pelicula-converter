[pytest]
testpaths = tests
pythonpath = .
# Sem .pytest_cache na raiz do projeto.
addopts = -ra -p no:cacheprovider
markers =
    gpu: precisa de OpenGL 3.3 (contexto moderngl standalone); pulado se não houver
    ffmpeg: precisa de ffmpeg e ffprobe; pulado se não forem encontrados
filterwarnings =
    ignore::DeprecationWarning:PySide6.*
